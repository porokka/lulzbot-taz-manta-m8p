# LulzBot TAZ 5 + Meteor 175 (0.6mm) + Bondtech LGX Ace, on BIGTREETECH Manta M8P V2.0
# Generated 2026-09-30 from the machine's known-good Marlin/RAMBo values (Configuration.h,
# EEPROM M503 dump) plus BTT's official V2.0 pin map. NOT YET FLASHED/TESTED ON HARDWARE.
#
# Before first power-on of steppers:
#   1. Flash MCU firmware for this board first (see notes at bottom).
#   2. TMC2209 drivers are on order - run_current values below are set for when they
#      arrive. Until then, comment out every [tmc2209 ...] section (drivers unplugged
#      will just show as missing, safe) or Klipper will refuse to start.
#   3. Z2 (second Z motor) is now on Manta's own Motor4 socket - the RAMBo-era "E1
#      header" hack is obsolete, the cable no longer needs to stay on that workaround.
#   4. TEST EVERY AXIS DIRECTION in tiny increments before trusting this - dir_pin
#      inversions were carried over from Marlin's INVERT_*_DIR but never verified on
#      this board's wiring.

[include mainsail.cfg]
# 2026-10-16: pt1000_test.cfg DISABLED. The PT1000 moved job - it is no longer a
# bare bench sensor on TH0, it now drives the Noctua via [temperature_fan noctua]
# below, which claims PB0 itself. PB0 cannot be claimed twice.
#[include pt1000_test.cfg]

# ========================================================================
# MCU
# ========================================================================
[mcu]
# UPDATE THIS after flashing - find the real path with:
#   ls /dev/serial/by-id/*
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_0D0017000551333231343036-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5          # TAZ5 Z lead screw - keep conservative until tuned
max_z_accel: 100

# ========================================================================
# STEPPERS - bed/travel geometry from Marlin Configuration.h (TAZ5 block):
#   X_BED_SIZE 298, Y_BED_SIZE 285, X -20.1..300.1, Y 0..300, Z max 290.7
#   steps/mm from EEPROM M92: X100 Y100 Z1600 E410
#   home directions all MIN (X_HOME_DIR/Y_HOME_DIR/Z_HOME_DIR = -1)
# ========================================================================

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 32          # = 200 full_steps * 16 microsteps / 100 steps/mm (Marlin M92 X100)
endstop_pin: ^!PF4                # ^ pullup + ! invert. VERIFIED BY OBSERVATION
                                # 2026-10-16: untouched read 1 and pressing read 0,
                                # i.e. triggered = LOW, matching Marlin's
                                # ENDSTOPPULLUPS + X_MIN_ENDSTOP_INVERTING true.
                                # Without the ! an OPEN switch reads as triggered
                                # and homing stops instantly without moving.
position_endstop: -20.1        # LULZBOT_X_MIN_POS
position_min: -20.1
position_max: 300.1            # LULZBOT_X_MAX_POS
homing_speed: 50

[stepper_y]
step_pin: PE2
dir_pin: !PE1                   # INVERTED. Marlin INVERT_Y_DIR true (the
                                # 2026-09-07 Y flip). CONFIRMED 2026-10-16: without
                                # the ! a negative jog drove the bed further toward
                                # Y-max instead of toward Y0.
enable_pin: !PE4
microsteps: 16
rotation_distance: 32          # = 200 full_steps * 16 microsteps / 100 steps/mm (Marlin M92 Y100)
endstop_pin: ^!PF3                # inverted - see stepper_x
position_endstop: 0            # LULZBOT_Y_MIN_POS
position_min: 0
position_max: 300              # LULZBOT_Y_MAX_POS
homing_speed: 50

# Z1 - the motor that stayed on the original Z position (right side, X-max side
# per the 2026-09-24 G34 session). This is the axis with the physical Z endstop.
[stepper_z]
step_pin: PB8
dir_pin: PB7                   # Marlin had INVERT_Z_DIR false for TAZ5 - verify on first jog
enable_pin: !PE0
microsteps: 16
rotation_distance: 2           # = 200 full_steps * 16 microsteps / 1600 steps/mm (Marlin M92 Z1600)
endstop_pin: ^!PF2                # inverted - see stepper_x
position_endstop: 0
position_min: -4                # 2026-10-19: probe contact is at about Z0, so with
                                # position_min 0 the move ends before it triggers.
                                # -2 only: the crash at -5 put the NOZZLE through the
                                # glass, which places the glass near Z-3.5, so -2
                                # keeps ~1.5mm of margin. Do NOT go lower.
position_max: 290.7            # LULZBOT_Z_MAX_POS
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

# Z2 - the motor moved during the 2026-09-24 G34 conversion (left side, X-min side).
# On RAMBo this was jury-rigged onto the E1 header; on the Manta it has its own proper
# Motor4 socket - no more spare-extruder-driver workaround needed.
[stepper_z1]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
microsteps: 16
rotation_distance: 2           # match stepper_z once that value is confirmed correct

# ========================================================================
# Z TILT - replaces Marlin's G34 (Z_STEPPER_AUTO_ALIGN). Probe points mirror the
# G34_M422 points used in Marlin: right side ~X230/Y145, left side ~X10/Y145.
# Runs automatically before each print via a start-gcode macro (add one - see bottom).
# ========================================================================
[z_tilt]
z_positions:
    0, 145                      # stepper_z  = Motor3 = LEFT screw (X-min side)
    290, 145                    # stepper_z1 = Motor4 = RIGHT screw (X-max side)
#                               # 2026-10-19: SWAPPED. Was 290 first, which sent each
#                               # correction to the wrong screw - Z_TILT_ADJUST
#                               # diverged (range 1.525 -> 3.259 instead of shrinking).
points:
    292, 127                    # probe lands (240,145) - near RIGHT screw at X290
    67, 127                     # probe lands (15,145)  - near LEFT  screw at X0
#                               # 2026-10-19: these are NOZZLE coords. Probe offset
#                               # is -52/+18, so the old (10,145) put the probe at
#                               # X-42, off the bed entirely - Z_TILT_ADJUST would
#                               # have probed thin air.
speed: 100
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.01            # 2026-10-19: was 0.02. PROBE_ACCURACY shows the
                                 # probe resolves to 0.003 std dev, so this is NOT
                                 # probe noise - the residual is lead-screw backlash
                                 # and gantry settling. 0.02 is tighter than a TAZ 5
                                 # Z axis can hold, so Z_TILT bounced and hit
                                 # "Too many retries" at ~0.05.

# ========================================================================
# EXTRUDER - Bondtech LGX Ace (rebuilt 2026-09-28 after the mush jam) +
# Meteor 175 hotend, 0.6mm nozzle. Motor5 socket on the Manta.
#   rotation_distance: back-calculated from this machine's own EEPROM-calibrated
#   E410 steps/mm (M92 readback), not Bondtech's generic "~400 steps/mm" spec figure -
#   200*16/410 = 7.805. The two are close but not identical; re-verify with a real
#   100mm extrude test after flashing regardless, since the LGX was rebuilt since
#   that calibration was last measured.
#   PID: DO NOT reuse the Marlin EEPROM numbers (14.64/0.96/56.06) - Klipper's PID
#   constants use different internal scaling. Run PID_CALIBRATE HEATER=extruder
#   TARGET=205 after first successful print start and paste the result in here.
# ========================================================================
# ========================================================================
# 2026-10-16: BENCH SCAFFOLDING REMOVED. [extruder] and [heater_bed] are live
# again and [manual_stepper e_test] is gone - all looms are connected.
#
# SENSOR SWAP (2026-10-16): the PT1000 is NOT in the hotend. It stays on TH0
# reading the driver area to regulate the Noctua. The hotend keeps its stock
# 100k EPCOS thermistor, now on TH1 = PC5. Derived from the Marlin config
# running this machine: TEMP_SENSOR_0 = 1 = 100k EPCOS, same table as the bed.
# Cost of the swap: hotend ceiling is the thermistor's ~300 C, not the PT1000's
# 400 C. Irrelevant for current filaments; it defers the PEEK roadmap only.
# ========================================================================
[extruder]
step_pin: PG13
dir_pin: !PG12                  # INVERTED. Marlin INVERT_E0_DIR true for TAZ5.
enable_pin: !PG15
microsteps: 16
rotation_distance: 7.805        # 200*16/410 from this machine's own M92 E410
nozzle_diameter: 0.6
filament_diameter: 1.75
heater_pin: PA0                 # HE0
sensor_pin: PC5                 # TH1 - stock 4.7k pullup, NOT TH0's 2.2k
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 19.178                  # PID_CALIBRATE HEATER=extruder TARGET=205, 2026-10-19
pid_Ki: 0.820
pid_Kd: 112.194
min_temp: 10                    # DELIBERATE GUARD, not a typo. BTT's docs say the
                                # PT1000 jumper sets the pullup for "TH0-TH1", which
                                # may mean TH1 shares TH0's 2.2k. If it does, this
                                # 100k EPCOS reads about 5 C at a true 20 C - too
                                # COLD, which is the dangerous direction: the heater
                                # would drive straight past target. min_temp 10 turns
                                # that silent misread into a refusal to start.
                                # If Klipper won't start and reports extruder below
                                # minimum: TH1 shares the jumper. Add
                                # pullup_resistor: 2200 here, do not lower min_temp.
max_temp: 260
pressure_advance: 0.02          # MEASURED 2026-10-20 with Orca's PA pattern test
                                # (accelerations 100-1000). The bulge at the end of
                                # each line shrank towards zero, smallest around 0.02.
                                # Low is expected here: the Meteor 175 is high-flow, so
                                # its short wide melt path builds less pressure and
                                # needs less advance to compensate.
max_extrude_only_distance: 100

[heater_bed]
heater_pin: PF5
sensor_pin: PB1                 # THB
sensor_type: EPCOS 100K B57560G104F
                                # Stock TAZ 5 bed thermistor, NOT a PT1000.
                                # Marlin TEMP_SENSOR_BED 1 = 100k EPCOS, 4.7k pullup.
control: pid
pid_Kp: 57.502                  # PID_CALIBRATE HEATER=heater_bed TARGET=60, 2026-10-19
pid_Ki: 1.071                   # measured on this machine - watermark gave a
pid_Kd: 771.968                 # +-2.5 C swing (on at 48, off at 53)
min_temp: 10                    # same guard and same reasoning as the extruder
max_temp: 130

# ---------------------------------------------------------------- FANS
# Port assignment VERIFIED BY OBSERVATION 2026-10-16, not inferred: each header
# was exposed as a [fan_generic] and driven one at a time while watching which
# physical fan turned. The config previously had [fan] on PF7, which was wrong -
# PF7 is the heatbreak fan. Had that shipped, the heatbreak fan would have been
# slicer-controlled and therefore OFF during the first layers while the hotend
# was hot: textbook heat creep, and the LGX Ace clog at layer 80-84 is already
# on record from exactly that failure.
#
#   PF7  Fan0  heatbreak     24 V  -> [heater_fan]   (CONFIRMED by observation)
#   PA4  Fan4  part cooling  24 V  -> [fan]          (CONFIRMED by observation)
#   PA6  Fan5  Noctua        12 V  -> [temperature_fan], tach on PC2
#
# The two voltage-jumper mistakes are NOT symmetric: 24 V into the 12 V Noctua
# kills it instantly; 12 V into a 24 V hotend fan merely halves its speed, which
# looks fine and silently causes heat creep weeks later.
# -----------------------------------------------------------------------
[heater_fan hotend_fan]
pin: PF7
heater: extruder
heater_temp: 50.0
fan_speed: 1.0                  # 2-WIRE 5 V fan (black+red only). Speed is set by
                                # the supply, so PWM here is the correct method.
                                # Kept at 1.0 because a heatbreak fan should run flat
                                # out whenever the hotend is hot - but unlike a 4-wire
                                # fan, lowering it is technically safe.
                                # No tach wire, so no RPM monitoring is possible.

[fan]
pin: PA4

[temperature_fan noctua]
pin: PA6
tachometer_pin: PC2
sensor_type: PT1000
sensor_pin: PB0                 # TH0
pullup_resistor: 2200           # VERIFIED 2026-10-14: the M8P PT1000 jumper makes
                                # this divider 2.2k. With Klipper's 4700 default
                                # this exact sensor read 360.87 C at a true 24 C.
                                # A wrong pullup returns a PLAUSIBLE number, never
                                # an error.
control: watermark
max_delta: 2
target_temp: 45
min_temp: 0
max_temp: 100
off_below: 0.2                  # a Noctua stalls and buzzes at very low duty
                                # rather than spinning - stop it cleanly instead

[bltouch]
sensor_pin: ^PD13                # ^ = pullup. Clones sometimes need ^! instead;
                                # QUERY_PROBE reporting TRIGGERED while the pin is
                                # retracted and clear means add the !
control_pin: PD12
pin_up_reports_not_triggered: False
pin_up_touch_mode_reports_triggered: False
probe_with_touch_mode: False            # 2026-10-19: set False per 3DTouch clone guidance.
                                # Klipper docs: many clones do NOT support touch
                                # mode. Evidence here: holding the pin raised an
                                # alarm, which in real touch mode would not happen.
stow_on_each_sample: True
#                               # 2026-10-19: touch mode added. In NORMAL mode a
#                               # clone emits only a BRIEF PULSE on trigger, which
#                               # is why QUERY_PROBE polling never caught it and
#                               # why PROBE ran the full travel into the bed. In
#                               # TOUCH mode the signal is HELD while the pin is
#                               # pushed. Documented clone fix - klipper3d.org/BLTouch
#                               # 2026-10-19: this is a 3D TOUCH (clone), not a
#                               # genuine Antclabs BLTouch. Clones do not support
#                               # Klipper's sensor-state verification tests, which
#                               # is what produced "BLTouch failed to verify sensor
#                               # state" on every PROBE. These two lines disable
#                               # those checks. Required for 3D Touch / clones.
x_offset: -52
y_offset: 18
# MEASURED 2026-10-14 against the OctoGrabs grid squares. Was -45/15, which is
# wrong by 7mm in X and 3mm in Y - that error put every G29 reading 7mm from
# where it was actually taken and caused weeks of left-low/right-high first
# layers on the Marlin side before it was found.
# When the BTT Eddy replaces the BLTouch on the same bracket, RE-MEASURE: its
# sensing point is the centre of the coil, not a pin tip.
#z_offset: 0                     # run PROBE_CALIBRATE to set this - do not guess from Marlin's -3.485

[safe_z_home]
home_xy_position: 30.1, 259.5   # matches Marlin's Z_SAFE_HOMING point
speed: 100
z_hop: 15
z_hop_speed: 5

[bed_mesh]
speed: 120
horizontal_move_z: 10
mesh_min: 10, 20
mesh_max: 245, 275
# Recomputed for the -52/+18 offset. The nozzle sits at (mesh - offset), so
# with X travel capped at 300.1 the probe cannot pass X248.1 - the previous
# mesh_max of 280 needed the nozzle at 332 and BED_MESH_CALIBRATE would simply
# have failed. Y is limited the other way: reaching mesh_y 18 needs the nozzle
# at Y0, so 20 is the practical front edge.
# Net effect vs the old values: a LOT more bed. 55->10 on the left recovers
# 45mm that was being extrapolated rather than measured.
# NOTE for the Eddy: horizontal_move_z below must drop from 10 to about 2 -
# eddy sensing range is only a few mm and it reads nothing at 10.
probe_count: 15, 15
algorithm: bicubic

# ========================================================================
# TMC2209 - drivers on order as of 2026-09-30. Leave this whole block commented
# until they're physically installed, or Klipper will fail to start looking for
# UART devices that aren't there yet.
#   E0 current set to 0.55A per Bondtech's LGX Ace Pro guidance (500-600mA range),
#   NOT the Manta template's default 0.8A - that's sized for a full NEMA17, not
#   the LGX's pancake motor, and running it hot was the likely cause of the
#   2026-09-30 silent-stall failure on the RAMBo.
# ========================================================================
[tmc2209 stepper_x]
uart_pin: PC13
run_current: 0.8
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PE3
run_current: 0.8
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PB9
run_current: 0.8                 # 2026-10-19: was 0.65. The two Z motors were going
                                # OUT OF SYNC, i.e. one losing steps under the
                                # gantry load. 0.65 A is low for lifting a gantry,
                                # and StealthChop is weaker than SpreadCycle.
stealthchop_threshold: 999999

[tmc2209 stepper_z1]
uart_pin: PB5
run_current: 0.8                 # 2026-10-19: was 0.65. The two Z motors were going
                                # OUT OF SYNC, i.e. one losing steps under the
                                # gantry load. 0.65 A is low for lifting a gantry,
                                # and StealthChop is weaker than SpreadCycle.
stealthchop_threshold: 999999    # 2026-10-19: back to StealthChop to MATCH stepper_z.
                                # Was 0 (SpreadCycle) only as an open-load
                                # diagnostic. Mixed modes on a dual-Z give the two
                                # motors different torque characteristics.

[tmc2209 extruder]
uart_pin: PG14
run_current: 0.55               # LGX Ace Pro pancake motor - NOT the template's
                                # 0.8 A, which is sized for a full NEMA17 and was
                                # the likely cause of the 2026-09-30 silent stall
stealthchop_threshold: 999999

# ========================================================================
# START/END GCODE MACROS - mirrors the Marlin start gcode logic from this session:
# heat, soak, home, Z_TILT_ADJUST (replaces G34), load bed mesh, purge line.
# ========================================================================
[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(205)|float %}
    M140 S{BED_TEMP}
    G28
    Z_TILT_ADJUST
    M190 S{BED_TEMP}
    G4 P120000              ; 2 min soak, matches the Marlin start gcode
    M109 S{EXTRUDER_TEMP}
    BED_MESH_PROFILE LOAD=default
    G90
    G1 Z2 F600
    G1 X40 Y85 F3000
    G1 Z0.4 F300
    G1 X90 Y85 E4 F300       ; purge line, same as the Marlin prime line
    G92 E0

[gcode_macro END_PRINT]
gcode:
    M400
    M104 S0
    M140 S0
    M107
    G91
    G1 E-2 F1800
    G1 Z10 F600
    G90
    G1 X0 Y250 F3000
    M84

