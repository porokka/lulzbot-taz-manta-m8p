[tmc2209 manual_stepper m7_test]
uart_pin: PD5
run_current: 0.5
stealthchop_threshold: 999999

[tmc2209 manual_stepper m8_test]
uart_pin: PC6
run_current: 0.5
stealthchop_threshold: 999999

# ===== Marlin compatibility macros (2026-10-19) =======================
# The Marlin-era test gcode files use commands Klipper does not implement.
# Klipper ABORTS on an unknown command, so without these a file dies a few
# lines in - after heating and soaking.
[gcode_macro G34]
gcode:
    Z_TILT_ADJUST

[gcode_macro M420]
description: Marlin mesh enable/disable -> Klipper bed_mesh
gcode:
    {% if params.S is defined and params.S|int == 1 %}
        BED_MESH_PROFILE LOAD=default
    {% else %}
        BED_MESH_CLEAR
    {% endif %}

[gcode_macro M900]
description: Marlin linear advance -> Klipper pressure advance
gcode:
    {% if params.K is defined %}
        SET_PRESSURE_ADVANCE ADVANCE={params.K|float}
    {% endif %}
