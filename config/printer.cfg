# ========================================================================
# FORCE_MOVE - added 2026-10-16 for first-power direction testing. Lets a
# single stepper be jogged before homing, IGNORING endstops and soft limits.
# Keep distances small and watch the axis.
#   FORCE_MOVE STEPPER=stepper_x DISTANCE=-10 VELOCITY=10
# NEGATIVE = toward min. The head is parked at X-max/Y-max, so negative is the
# direction with room; a positive jog would drive it further into the end stop.
# Safe to leave enabled, but it is a footgun - it obeys no limits at all.
# ========================================================================
[force_move]
enable_force_move: True

# ===== TEMPORARY 2026-10-16 - MOTOR PORT SWEEP ========================
# Motor6 declared as a manual_stepper purely so every port can be jogged
# while watching which physical axis responds. REMOVE when done.
[manual_stepper m6_test]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 16
rotation_distance: 2

[tmc2209 manual_stepper m6_test]
uart_pin: PG10
run_current: 0.5
stealthchop_threshold: 999999
# ======================================================================



